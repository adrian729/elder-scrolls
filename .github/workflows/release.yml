name: Publish library

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run test:demo
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:integration
      - name: Publish with provenance through npm Trusted Publishing
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          archive=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'))[0].filename")
          npm publish "$archive" --access public --provenance --registry https://registry.npmjs.org
